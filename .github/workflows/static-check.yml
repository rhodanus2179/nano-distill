name: Static check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and unit tests
        run: npm run verify
      - name: Verify vendored PDF.js
        run: |
          test -s vendor/pdfjs/pdf.min.mjs
          test -s vendor/pdfjs/pdf.worker.min.mjs
          test -s vendor/pdfjs/LICENSE
